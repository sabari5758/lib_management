<div class="book-detail-container">
  <div *ngIf="book" class="book-detail-card">
    <div class="book-cover">{{ book.cover }}</div>
    <div class="book-info">
      <h1 class="book-title">{{ book.title }}</h1>
      <p class="book-author">by {{ book.author }}</p>
      <div class="book-status" [ngClass]="book.status">
        Status: {{ book.status.replace('-', ' ') }}
      </div>
      <button class="back-button" routerLink="/">Back to Catalog</button>
    </div>
  </div>
  <div *ngIf="!book" class="not-found">
    <h1>Book not found</h1>
    <p>Sorry, the book you are looking for does not exist.</p>
    <button class="back-button" routerLink="/">Back to Catalog</button>
  </div>
</div>
